<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudut aesthetic Sekolah</title>
    <style>
        /* Palet Warna Nuansa Alam & Minimalis */
        :root {
            --primary-color: #5b7050; 
            --bg-color: #f7f9f4; 
            --text-color: #33402e;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(19, 74, 45, 0.34), rgba(196, 99, 39, 0.24)),
                url("https://pijarnews.id/wp-content/uploads/2021/02/WhatsApp-Image-2021-02-19-at-14.38.41-e1613803356483.jpeg") center top / 100% auto no-repeat,
                linear-gradient(135deg, #eaf4df 0%, #7aa86d 60%, #d98d4c 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(170, 255, 188, 0.12), transparent 34%),
                radial-gradient(ellipse at 82% 74%, rgba(255, 180, 108, 0.1), transparent 36%);
            transform: translate3d(0, 0, 0) scale(1.03);
            animation: fluidDrift 24s ease-in-out infinite alternate;
        }

        @keyframes fluidDrift {
            from { transform: translate3d(-1%, -1%, 0) scale(1.03); }
            to { transform: translate3d(1%, 1%, 0) scale(1.06); }
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
            max-width: 600px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .school-mark {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.55rem 1rem;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 999px;
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.95);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .school-mark .book-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .gallery-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            color: rgba(255,255,255,0.9);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeIn 1.2s ease-out;
        }

        .gallery-label::before,
        .gallery-label::after {
            content: "";
            width: 42px;
            height: 1px;
            background: rgba(255,255,255,0.65);
        }

        footer {
            width: min(90%, 1000px);
            box-sizing: border-box;
            margin: 1rem 0 2rem;
            padding: 1rem 1.25rem;
            border: 1px solid rgba(255,255,255,0.36);
            border-radius: 16px;
            background: rgba(255,255,255,0.13);
            color: rgba(255,255,255,0.9);
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 1px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            animation: fadeIn 1.5s ease-out;
        }

        footer strong {
            color: #ffffff;
        }

        h1 {
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.18);
        }

        p {
            font-style: italic;
            opacity: 0.96;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 1px 3px rgba(0,0,0,0.12);
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 50px; 
            padding: 2rem;
            max-width: 1000px; 
            width: 100%;
            box-sizing: border-box;
        }

        /* Animasi Masuk Card (Fade Up) */
        .card {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.45);
            background: linear-gradient(135deg, rgba(46, 103, 62, 0.78), rgba(207, 116, 45, 0.72));
            box-shadow: 0 10px 24px rgba(31, 41, 55, 0.12);
            backdrop-filter: blur(6px) saturate(1.08);
            -webkit-backdrop-filter: blur(6px) saturate(1.08);
            transform: translateY(30px);
            opacity: 0;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            cursor: pointer;
            user-select: none;
        }

        /* Jeda waktu kemunculan tiap card biar estetik berurutan */
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.45s; }
        .card:nth-child(5) { animation-delay: 0.6s; }
        .card:nth-child(6) { animation-delay: 0.75s; }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.34), rgba(255,255,255,0.08) 42%, rgba(255,255,255,0.12));
            pointer-events: none;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-8px) translate3d(0, 0, 0);
            box-shadow: 0 14px 28px rgba(31, 41, 55, 0.12);
            border-color: rgba(255,255,255,0.82);
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
        }

        .card-content {
            position: relative;
            z-index: 2;
            display: block;
            color: inherit;
            text-decoration: none;
            background: transparent;
        }

        .photo-frame {
            position: relative;
            cursor: zoom-in;
        }

        .photo-modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(5, 20, 13, 0.82);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .photo-modal.is-open {
            opacity: 1;
            visibility: visible;
        }

        .photo-modal img {
            max-width: min(92vw, 1100px);
            max-height: 86vh;
            object-fit: contain;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: scaleUp 0.3s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: fixed;
            top: 18px;
            right: 22px;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
            color: #ffffff;
            font-size: 1.7rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.3);
        }

        .card img {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9; 
            object-fit: cover;
            display: block;
            background-color: #e5eadc;
            filter: saturate(1.04) contrast(1.01);
            transition: transform 0.35s ease, filter 0.35s ease;
        }

        .card:hover img {
            transform: scale(1.05);
            filter: saturate(1.12) contrast(1.05);
        }

        .card-info {
            position: relative;
            z-index: 2;
            padding: 1.2rem 1rem 1.35rem;
            text-align: center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .card-info h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 1px 2px rgba(0,0,0,0.18);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (min-width: 768px) {
            .gallery {
                flex-direction: row;
                flex-wrap: wrap; 
                justify-content: center; 
                gap: 40px; 
            }
            .card {
                flex: 0 1 calc(33.333% - 40px);
                min-width: 280px; 
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="school-mark"><span class="book-icon" aria-hidden="true">&#128218;</span> SMANSKA</div>
        <h1>tempat estetik di smanska</h1>
        <p>Menangkap ketenangan dan keindahan di lingkungan belajar.</p>
    </header>

    <div class="gallery">
        <div class="gallery-label"><span aria-hidden="true">&#10022;</span> sudut estetik di smanska <span aria-hidden="true">&#10022;</span></div>
        
        <!-- CARD 1 -->
        <div class="card">
            <div class="card-content">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/cJG05kLG/IMG-20260909-WA0020.jpg" alt="Taman Hijau" width="640" height="360" loading="eager" decoding="async">
                </div>
                <div class="card-info"><h3>Taman Hijau</h3></div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
            <div class="card-content">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/VNFQZYhn/IMG-20260909-WA0028.jpg" alt="Lorong Tenang" width="640" height="360" loading="lazy" decoding="async">
                </div>
                <div class="card-info"><h3>Lorong Tenang</h3></div>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
            <div class="card-content">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/NMPhYKbG/4716.jpg" alt="Keindahan di depan kelas" width="640" height="360" loading="lazy" decoding="async">
                </div>
                <div class="card-info"><h3>keindahan di depan kelas</h3></div>
            </div>
        </div>

        <!-- CARD 4 -->
        <div class="card">
            <div class="card-content">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/xjNYnSJ6/IMG-20260909-WA0021.jpg" alt="Pepohonan di smanska" width="640" height="360" loading="lazy" decoding="async">
                </div>
                <div class="card-info"><h3>pepohonan di smanska</h3></div>
            </div>
        </div>

        <!-- CARD 5 -->
        <div class="card">
            <div class="card-content">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/JtwRVp5Z/4708.jpg" alt="Lapangan basket smanska" width="640" height="360" loading="lazy" decoding="async">
                </div>
                <div class="card-info"><h3>lapangan basket smanska</h3></div>
            </div>
        </div>
    </div>

    <footer>
        <span>Domain by <strong>Kak Salman</strong></span>
        <span aria-hidden="true"> &bull; </span>
        <span>Property of <strong>Galang</strong></span>
    </footer>

    <!-- Modal untuk Zoom Preview Foto -->
    <div class="photo-modal" role="dialog" aria-modal="true" aria-label="Preview foto" aria-hidden="true">
        <button class="modal-close" type="button" aria-label="Tutup preview">&times;</button>
        <img src="" alt="Preview foto">
    </div>

    <script>
        // Logika Modal untuk memperbesar gambar saat diklik
        const modal = document.querySelector('.photo-modal');
        const modalImage = modal.querySelector('img');
        
        const closeModal = () => {
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
        };

        document.querySelectorAll('.photo-frame').forEach(frame => {
            frame.addEventListener('click', () => {
                const img = frame.querySelector('img');
                modalImage.src = img.src;
                modalImage.alt = img.alt;
                modal.classList.add('is-open');
                modal.setAttribute('aria-hidden', 'false');
            });
        });

        modal.addEventListener('click', (event) => {
            if (event.target === modal || event.target.closest('.modal-close')) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
